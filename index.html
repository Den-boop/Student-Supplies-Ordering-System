<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Supplies Ordering System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Student Supplies Ordering System</h1><p>Your school supplies shop</p></header>
  <main class="container">
    <section class="products-section">
      <h2>Product List</h2><p>Select the school supplies you want to buy.</p>
      <div id="product-list" class="product-grid"></div>
    </section>
    <section class="cart-section">
      <h2>Shopping Cart</h2>
      <div id="cart-items"><p>Your cart is empty.</p></div>
    </section>
    <section class="summary-section">
      <h2>Order Summary</h2>
      <p>Total Items: <span id="total-items">0</span></p>
      <h3>Total Amount: <span id="total-amount">₱0.00</span></h3>
    </section>
    <!-- Step 6: Cash payment -->
    <section class="payment-section">
      <h2>Cash Payment</h2>
      <label for="payment-amount">Amount Paid (₱)</label>
      <input id="payment-amount" type="text" inputmode="decimal" placeholder="Enter cash amount" autocomplete="off">
      <button id="confirm-payment" type="button" onclick="confirmPayment()">Confirm Payment</button>
      <p id="payment-message" role="status" aria-live="polite"></p>
    </section>
    <!-- Step 6: Receipt appears after a successful payment -->
    <section class="receipt-section">
      <h2>Digital Receipt</h2>
      <div id="receipt"><p>No receipt generated yet.</p></div>
      <button id="new-transaction-btn" type="button" onclick="newTransaction()" hidden>New Transaction</button>
    </section>
  </main>
  <footer><p>Student Supplies Ordering System</p></footer>
  <script src="script.js"></script>
</body>
</html>
